[package]
name = "palantir-desktop"
description = "The native PalantirMC 2.0 desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[[bin]]
name = "PalantirMC"
path = "src/main.rs"

[dependencies]
# MIT: native widgets, SVG rendering, and an event loop with a software renderer.
iced = { version = "=0.12.1", default-features = false, features = ["svg", "tokio", "advanced"] }
serde.workspace = true
serde_json.workspace = true
# MIT: read public pack archives through the same zip crate already used by the engine.
zip = "2"
palantir-core = { path = "../palantir-core" }
palantir-net = { path = "../palantir-net" }
palantir-loader = { path = "../palantir-loader" }
