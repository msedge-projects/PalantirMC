[package]
name = "palantir-loader"
description = "Turning a chosen game and loader into an installed, launchable version"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[dependencies]
# The metadata formats and their `inheritsFrom` merging: a loader install is
# one document over another's.
palantir-core = { path = "../palantir-core" }
# The fetch-and-verify layer: installs are a composition of its syncer.
palantir-net = { path = "../palantir-net" }
# The runtime documents are JSON, with unmodelled parts that ride along.
# MIT OR Apache-2.0.
serde = { workspace = true }
serde_json = { workspace = true }
# Extracting natives jars is a zip operation on files the installer lands.
zip = "2"


[dev-dependencies]
# The mock HTTP server shared with the other crates' tests. Test-only.
test-support = { path = "../test-support" }

