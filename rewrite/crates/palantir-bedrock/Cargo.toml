[package]
name = "palantir-bedrock"
description = "Finding, launching and managing the Bedrock copy Microsoft installed"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[dependencies]
# A pack's own `manifest.json` is JSON, and the activation files beside it
# are JSON lists of pack identities. MIT OR Apache-2.0.
serde = { workspace = true }
serde_json = { workspace = true }
# A `.mcpack`/`.mcaddon`/`.mcworld` is a zip, and exporting a world without
# touching its database means writing one. Same crate and version the engine
# already uses for natives and pack archives. MIT.
zip = "2"
# `level.dat` is gzipped NBT, so reading a world's name and version means
# decompressing it. Already in the graph under `zip`; MIT OR Apache-2.0.
flate2 = "1"
