name: Release

# Publishing is tag-driven on purpose: the tag names the version, the guard job
# checks it agrees with the product's own manifest (`crates/sift-ui/Cargo.toml`),
# and the same commit is what CI tested.
# `workflow_dispatch` exists to re-publish a tag whose upload failed -- it does
# not invent one, because `gh release create --verify-tag` refuses to create a
# tag that isn't already in the repository.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to rebuild and re-publish (e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  guard:
    # Renamed from `Check tag against Cargo.toml` because it no longer reads that
    # file's version: `crates/sift-ui` is a workspace of its own and declares its
    # own `version`, so the root manifest's `[workspace.package] version` does not
    # reach the exe that ships.
    name: Check tag against crates/sift-ui/Cargo.toml
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Fails in ten seconds rather than after a fifteen-minute build, and it
      # fails on the thing that is otherwise only noticed by whoever downloads
      # the file and finds the version inside it is not the version it claims.
      - name: Compare tag and product version
        shell: pwsh
        env:
          REQUESTED: ${{ inputs.tag || github.ref_name }}
        run: |
          $tag = $env:REQUESTED
          if (-not $tag.StartsWith("v")) {
            throw "Release tags must look like v0.1.0 (got '$tag')"
          }

          # The rule is unchanged -- the tag is `v` plus the declared version --
          # but the file it reads moved with the product. The exe in the release is
          # built from `crates/sift-ui/Cargo.toml`, so that is the number the tag
          # has to match; the root workspace's version does not apply to it, and
          # bumping one does not move the other.
          $declared = (Select-String -Path crates/sift-ui/Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' -List).Matches[0].Groups[1].Value
          if ($tag -ne "v$declared") {
            throw "Tag '$tag' does not match the product version '$declared' in crates/sift-ui/Cargo.toml"
          }

          # Reported, not enforced: the root manifest still carries the iced crates,
          # whose version is not what this tag publishes. A warning keeps the drift
          # visible without failing a release over a crate that no longer ships --
          # when `crates/sift-desktop` goes, this check goes with it.
          $root = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' -List).Matches[0].Groups[1].Value
          if ($root -ne $declared) {
            Write-Warning "Root workspace version is '$root'; the product in crates/sift-ui is '$declared'."
          }

          "Releasing $tag (product version $declared, from crates/sift-ui/Cargo.toml)" | Out-File -Encoding utf8 -Append $env:GITHUB_STEP_SUMMARY

  build:
    name: Build exe (${{ matrix.target }})
    needs: guard
    runs-on: windows-latest
    # 60 rather than 45: this leg now builds the egui product *and*, for one more
    # slice, the iced launcher, each with its own release compile on top of the
    # root workspace's test run.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # The static CRT is what makes both downloads runnable on a machine
          # with no Visual C++ redistributable installed; see the same matrix
          # in `ci.yml` for the measurement that showed it was needed. The flag
          # applies to the egui build too, and the DLL gate below is what proves
          # it: eframe links the same C runtime iced did.
          - target: x86_64-pc-windows-msvc
            rustflags: "-C target-feature=+crt-static"
          - target: x86_64-pc-windows-gnu
            rustflags: ""
    steps:
      - uses: actions/checkout@v4

      - name: Install mingw-w64
        if: matrix.target == 'x86_64-pc-windows-gnu'
        shell: pwsh
        run: |
          choco install mingw --no-progress -y
          Add-Content -Path $env:GITHUB_PATH -Value "C:\ProgramData\chocolatey\bin"

      - name: Add rust target
        run: rustup target add ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          # Both lock files: this job builds both workspaces, for the same reason
          # `ci.yml`'s package job does.
          key: ${{ runner.os }}-${{ matrix.target }}-release-${{ hashFiles('Cargo.lock', 'crates/sift-ui/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-release-

      # Tests run before anything is published: a release built from a commit
      # that does not pass its own suite is not a release.
      - name: Run tests
        run: cargo test --workspace --all-targets --locked

      # And the product's own suite, which `--workspace` above cannot reach: the
      # egui app is a separate workspace with its own lock file.
      - name: Test the egui workspace
        working-directory: crates/sift-ui
        run: cargo test --locked

      - name: Build release
        working-directory: crates/sift-ui
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Stage the exe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "crates/sift-ui/target/${{ matrix.target }}/release/SiftUi.exe" dist/SiftUi.exe

          $exe = Get-Item dist/SiftUi.exe
          # 60MB: the workspace declares its own release profile and the binary it
          # produces measured 11,981,120 bytes. Same bound, same reason, as the
          # package job in `ci.yml`.
          if ($exe.Length -lt 1MB -or $exe.Length -gt 60MB) {
            throw "Unexpected SiftUi.exe size: $($exe.Length) bytes"
          }

      - name: Check the exe's DLL dependencies
        run: python .github/scripts/check_exe.py dist/SiftUi.exe

      # The installer, on the msvc leg only: it wraps the static-CRT exe, and the gnu leg
      # would produce a second, differently-linked setup for no benefit.
      #
      # 0.1.1, 0.1.2 and 0.1.4 all died here: `installer/sift.nsi` opened an animated banner
      # in a `SysAnimate32` control, which POSIX makensis compiles and the runner's NSIS 3.13
      # refuses. The banner is gone (see the file), so what is left is a stock NSIS script --
      # and this step is where that claim is finally tested on 3.13.
      - name: Build the installer
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: pwsh
        env:
          REQUESTED: ${{ inputs.tag || github.ref_name }}
        run: |
          $makensis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (-not (Test-Path $makensis)) {
            choco install nsis --no-progress -y
            Get-ChildItem "${env:ProgramFiles(x86)}\NSIS" -ErrorAction SilentlyContinue | Write-Host
          }
          if (-not (Test-Path $makensis)) { throw "makensis is not installed at $makensis" }

          # The tag is `v0.1.8`; the installer prints the version, so it is the bare one.
          $version = $env:REQUESTED.TrimStart('v')

          # The script writes `${HERE}${APP_EXE}`, and `${HERE}` already ends in a
          # backslash: a `../` in APP_EXE gives a path POSIX makensis normalises and the
          # runner's NSIS 3.13 does not (it aborted on the `File` line with 0.1.8). The exe
          # is copied beside the script and handed over as a plain relative name.
          New-Item -ItemType Directory -Force -Path installer/dist | Out-Null
          Copy-Item dist/SiftUi.exe installer/dist/SiftUi.exe

          Write-Host "makensis: $makensis"
          Write-Host "version:  $version"
          Write-Host "payload:  $((Get-Item installer/dist/SiftUi.exe).FullName) ($((Get-Item installer/dist/SiftUi.exe).Length) bytes)"

          # makensis resolves `!define HERE` and its output against the directory it is run
          # from, which is why this pushes into `installer/`. Its output is captured so a
          # failure carries NSIS's own sentence into the log instead of only the line number.
          Push-Location installer
          $payload = (Resolve-Path dist/SiftUi.exe).Path
          $root = ((Resolve-Path .).Path -replace '\\', '/') + '/'
          $out = & $makensis /V3 /DVERSION=$version "/DPAYLOAD=$payload" "/DROOT=$root" sift.nsi 2>&1
          $code = $LASTEXITCODE
          Pop-Location
          $out | ForEach-Object { Write-Host $_ }
          if ($code -ne 0) { throw "makensis exited $code" }

          $setup = Get-ChildItem dist -Filter *-setup.exe
          if (-not $setup) { throw "no setup exe was produced" }
          if ($setup.Length -lt 1MB) { throw "Unexpected setup size: $($setup.Length) bytes" }
          Write-Host "Installer: $($setup.Name), $($setup.Length) bytes"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sift-launcher-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      # The only job in either workflow that writes anything.
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download every build
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      # Both targets are published, named so a downloader can tell which is
      # which. The MSVC build is the recommended one; the GNU build is what the
      # project is developed against locally, and publishing both means a
      # regression in either is visible to users immediately.
      #
      # Only `sift-launcher-*` is collected: the `iced-*` artifacts the build job
      # still produces are for inspection and are deliberately not release files.
      - name: Collect and rename release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null

          "### Release files" | Out-File -Encoding utf8 -Append $env:GITHUB_STEP_SUMMARY
          "| File | Size | sha256 |" | Out-File -Encoding utf8 -Append $env:GITHUB_STEP_SUMMARY
          "| --- | --- | --- |" | Out-File -Encoding utf8 -Append $env:GITHUB_STEP_SUMMARY

          Get-ChildItem -Path artifacts -Recurse -File -Filter *.exe | ForEach-Object {
            # `return` inside a ForEach-Object script block skips this item and
            # continues with the next one, which is what keeps the temporary iced
            # artefacts out of the release without changing the loop body below.
            if ($_.Directory.Name -notlike 'sift-launcher-*') { return }

            # The setup exe is already named the way it should be published, and the rename
            # below would flatten it onto the bare exe's name -- two different files, one
            # name, whichever the loop reached last.
            if ($_.Name -like '*-setup.exe') {
              Copy-Item $_.FullName "release/$($_.Name)"
              $setupHash = (Get-FileHash "release/$($_.Name)" -Algorithm SHA256).Hash.ToLower()
              [System.IO.File]::WriteAllText("release/$($_.Name).sha256", "$setupHash  $($_.Name)`n")
              "| $($_.Name) | $($_.Length) bytes | $setupHash |" |
                Out-File -Encoding utf8 -Append $env:GITHUB_STEP_SUMMARY
              return
            }

            $target = $_.Directory.Name
            $label = switch -Wildcard ($target) {
              "*msvc" { "x64-msvc" }
              "*gnu"  { "x64-gnu" }
              default { $target }
            }

            # Named after the product rather than after the file inside it: the exe
            # in the zip is `SiftUi.exe` (crates/sift-ui's `[[bin]]`), and the
            # published name is the one the README and the download instructions
            # refer to.
            $name = "SiftLauncher-$label.exe"
            Copy-Item $_.FullName "release/$name"

            # Regenerated after renaming: the sidecar has to name the file it
            # actually sits next to for `sha256sum -c` to work.
            $hash = (Get-FileHash "release/$name" -Algorithm SHA256).Hash.ToLower()
            [System.IO.File]::WriteAllText("release/$name.sha256", "$hash  $name`n")

            $sidecar = [System.IO.File]::ReadAllText("release/$name.sha256")
            if ($sidecar -ne "$hash  $name`n") {
              throw "sha256 sidecar is not in 'sha256sum -c' form: '$sidecar'"
            }

            "| $name | $((Get-Item "release/$name").Length) bytes | $hash |" |
              Out-File -Encoding utf8 -Append $env:GITHUB_STEP_SUMMARY
          }

          # A zip as well as the bare exe: some downloaders hand .exe files to
          # the browser's safe-browsing flow, and a zip sidesteps that.
          Get-ChildItem -Path release -Filter *.exe | ForEach-Object {
            Compress-Archive -Path $_.FullName, "$($_.FullName).sha256" `
              -DestinationPath ($_.FullName -replace '\.exe$', '.zip') -Force
          }

          # The licence and the readme are release files, not repository decoration:
          # the binary ships under `LicenseRef-Proprietary`, so its terms travel with
          # the download, and a release missing either is a failed release rather
          # than a shorter file list.
          foreach ($doc in 'LICENSE', 'README.md') {
            if (-not (Test-Path $doc)) {
              throw "$doc is missing; the release would ship without it."
            }
            Copy-Item $doc release/
          }

          Get-ChildItem release | Format-Table Name, Length | Out-String | Write-Host

      - name: Create or refresh the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUESTED: ${{ inputs.tag || github.ref_name }}
        run: |
          $tag = $env:REQUESTED
          $files = Get-ChildItem release -File | ForEach-Object { $_.FullName }

          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag already exists -- replacing its files."
            gh release upload $tag @files --clobber
          } else {
            gh release create $tag @files `
              --verify-tag `
              --title "SiftLauncher $tag" `
              --generate-notes
          }

          gh release view $tag --json url --jq .url | Out-File -Encoding utf8 -Append $env:GITHUB_STEP_SUMMARY
