# One grouped PR per ecosystem, and majors deliberately not offered.
#
# Why the shape changed: every open pull request gets CI re-run whenever
# `master` moves, so eight open Dependabot PRs meant every ordinary push
# started nine pipelines instead of one. On a private repo paying 2x for
# Windows runners that is the single largest cost in the project, and it was
# being paid for information nobody had acted on.
#
# Majors are suppressed because they are the ones that need code changes
# (`thiserror` 1 -> 2, `image` 0.24 -> 0.25, `windows-sys` 0.52 -> 0.61,
# `sha2` 0.10 -> 0.11 all touch call sites), so they arrive as a permanent
# open PR rather than a mergeable one. They are still visible on demand --
# drop the `ignore` block and Dependabot will offer them again.
version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      cargo:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "deps"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "ci"
