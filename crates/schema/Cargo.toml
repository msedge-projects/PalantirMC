# Copied from PandoraLauncher (https://github.com/Moulberry/PandoraLauncher),
# crates/schema. MIT, Copyright (c) 2025 Moulberry -- see THIRD_PARTY_NOTICES.md
# and licenses/PandoraLauncher-LICENSE.txt. The only difference from upstream is
# this manifest: dependency versions are spelled out here rather than inherited
# from Pandora's workspace.
[package]
name = "schema"
description = "PandoraLauncher's schema types, adopted by PalantirMC"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
authors = ["Moulberry"]
repository = "https://github.com/Moulberry/PandoraLauncher"

[dependencies]
chrono = { version = "0.4.42", features = ["serde"] }
indexmap = { version = "2.12.0", features = ["serde"] }
serde = { version = "1.0.228", features = ["rc", "alloc", "derive"] }
serde-untagged = "0.1.9"
serde_json = "1.0.145"
ustr = { version = "1.1.0", features = ["serde"] }
enumset = { version = "1.1.10", features = ["serde"] }
relative-path = { version = "2.0.1", features = ["serde"] }
enum-map = "2.7.3"
strum = { version = "0.27.2", features = ["derive"] }
once_cell = "1.21.3"
urlencoding = "2.1.3"
uuid = { version = "1.18.1", features = ["serde"] }
parking_lot = { version = "0.12.5", features = ["deadlock_detection"] }
rustc-hash = "2.1.1"
