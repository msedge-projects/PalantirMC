[package]
name = "prism-gui"
description = "Shared view-model for the desktop shell: instance list and override-gated settings"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
# The models are read by the shell, never serialized, so this crate needs no
# serde at all: `prism-core` owns the file formats.
prism-core = { path = "../prism-core" }
thiserror = "1"

[dev-dependencies]
tempfile = "3"
