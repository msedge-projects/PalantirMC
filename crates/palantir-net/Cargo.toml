[package]
name = "palantir-net"
description = "PalantirMC networking: auth, downloads, API clients (phase 2)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
palantir-core = { path = "../palantir-core" }
reqwest = { version = "0.11", features = ["blocking", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
sha2 = "0.10"
# The content store is named by digests, and the services do not agree on which
# one: Mojang publishes a sha1 per asset and library and a sha1 for the asset
# index itself, Modrinth publishes a sha1 and a sha512 per file, and Prism's
# metadata publishes a sha256. All three are verified rather than trusted, so all
# three are computed. Same version the desktop crate and this one's own dev
# dependencies already use, so it adds no package to the lock file.
sha1 = "0.10"
# `auth` builds the entitlements request id itself: the endpoint takes a UUID
# and answers an empty item list without one. Already in the workspace lock file.
uuid.workspace = true

[dev-dependencies]
tempfile = "3"
