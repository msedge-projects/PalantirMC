[package]
name = "palantir-net"
description = "PalantirMC networking: auth, downloads, API clients (phase 2)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
palantir-core = { path = "../palantir-core" }
reqwest = { version = "0.11", features = ["blocking", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
sha2 = "0.10"
# `auth` builds the entitlements request id itself: the endpoint takes a UUID
# and answers an empty item list without one. Already in the workspace lock file.
uuid.workspace = true

[dev-dependencies]
tempfile = "3"
# The live test checks that a runtime entry's published digest is the digest of
# the manifest its URL serves — the one assumption the whole Java-download path
# rests on: if it were wrong, every install would be refused as tampered with,
# and only a live test can notice, because a fixture would have been written
# with the same assumption. Same version the desktop crate already uses.
sha1 = "0.10"
