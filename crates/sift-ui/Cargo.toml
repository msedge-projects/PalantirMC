[workspace]
# **Its own workspace, deliberately.** `iced_winit` 0.12 (the stack this slice is
# migrating away from) pins `web-sys = "=0.3.67"`, and `eframe` 0.36 requires
# `^0.3.103`; one lock file cannot hold both. A separate workspace is what lets the
# iced launcher keep building while the egui one grows, which a migration needs and a
# rewrite-the-lot-in-one-commit does not have.
#
# The cost is that the root `cargo test --workspace` does not compile this crate; CI
# has a job of its own for it (`egui-slice` in `.github/workflows/ci.yml`).

[package]
name = "sift-ui"
# The first slice of the move from iced to egui. It is a binary rather than a page of
# the launcher because what it answers is a frame-time question, not a product one:
# the same scrolling list, the same frame log, on the same machine.
#
# `rust-version` is 1.98 rather than this workspace's 1.74 because `fastframe-scroll`
# (vendored at `vendor/fastframe-scroll`) is edition 2024 and states 1.98. Nothing
# else in the tree needs it; the workspace's own floor is unchanged for the crates
# that do not depend on this one.
version = "0.1.50"
edition = "2021"
rust-version = "1.98"
publish = false

[[bin]]
name = "SiftUi"
path = "src/main.rs"

[dependencies]
# egui and its framework: the stack spotifast and fastframe are built on. `glow`
# rather than wgpu: it is the renderer fastframe's own apps use, and the one whose
# per-frame cost this slice is measuring. `x11` and `wayland` are no-ops on Windows
# and name the two Linux backends eframe otherwise refuses to choose between.
egui = { version = "0.36.1", default-features = false, features = ["default_fonts"] }
eframe = { version = "0.36.1", default-features = false, features = [
    "glow",
    "default_fonts",
    "x11",
    "wayland",
] }
# Vendored at `vendor/fastframe-scroll`: the 120-point wheel step, the touchpad
# scale and the glide that make spotifast's scrolling feel like the platform's.
fastframe-scroll = { path = "../../vendor/fastframe-scroll" }
# The launcher's own client, for project icons: one HTTP path in the product, not two.
sift-net = { path = "../sift-net" }
# The core crate: instances on disk, the pack profile, and the paths a launcher shares.
sift-core = { path = "../sift-core" }
sift-game = { path = "../sift-game" }
# The formats the project CDN actually serves. Measured, not assumed: asking for
# `.../icon.png` answers **400**, and the API's own `icon_url` is a hashed `.webp` (with
# some projects still on `.png`), so both decoders are needed and neither is speculative.
serde_json = "1"
flate2 = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }

# The release profile this workspace ships with.
#
# A nested workspace inherits nothing, so the root's `lto = true` / `strip = true` never applied
# here and the exe that shipped was an unstripped default-release build -- bigger on disk and
# slower to page in than it needed to be. `panic = "abort"` is the owner's accepted trade: a
# panic ends the process instead of unwinding, which is what a GUI wants and what removes the
# landing pads this binary will never use.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
