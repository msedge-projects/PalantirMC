[workspace]
resolver = "2"
members = [
    "crates/palantir-core",
    "crates/palantir-net",
    "crates/palantir-loader",
    "crates/palantir-gui",
    "crates/palantir-cli",
    "crates/palantir-desktop",
    # PandoraLauncher's crates, adopted wholesale (MIT, Copyright (c) 2025
    # Moulberry). They are members like any other. Attribution lives in
    # THIRD_PARTY_NOTICES.md, licenses/PandoraLauncher-LICENSE.txt and a doc
    # comment at the top of each crate's lib.rs.
    "crates/nbt",
    "crates/schema",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
license = "GPL-3.0-only"
authors = ["Palantir Studios"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
uuid = { version = "1", features = ["v4"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
