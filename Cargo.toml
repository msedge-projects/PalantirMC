[workspace]
resolver = "2"
members = [
    "crates/prism-core",
    "crates/prism-net",
    "crates/prism-loader",
    "crates/prism-gui",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
license = "GPL-3.0-only"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
uuid = { version = "1", features = ["v4"] }

[profile.release]
lto = "thin"
opt-level = "s"
strip = true
