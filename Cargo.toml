[workspace]
resolver = "2"
members = [
    "crates/palantir-core",
    "crates/palantir-net",
    "crates/palantir-loader",
    "crates/palantir-desktop",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
# Our own terms, not the GPL. The owner's decision of 2026-10-08, taken on legal
# advice, and `LICENSE` is the text. `LicenseRef-Proprietary` is the SPDX form for
# a licence with no SPDX identifier of its own; the obligations that came with the
# vendored reference are being removed rather than inherited, and `NOTES.md`
# keeps the list of what is still in the tree while that work is unfinished.
license = "LicenseRef-Proprietary"
authors = ["Palantir Studios"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
uuid = { version = "1", features = ["v4"] }

# The text engine, taken as source rather than from the registry because it needs
# two edits: cosmic-text 0.10.0 looks for a missing glyph only among the faces
# whose weight equals the request, and Windows publishes its CJK faces at 400 and
# 700 alone, so every hanzi in a 500-weight body drew as `.notdef`. The patch is
# `vendor/cosmic-text`, `THIRD_PARTY_NOTICES.md` says what it changes, and it is
# meant to be merged upstream rather than carried.
[patch.crates-io]
cosmic-text = { path = "vendor/cosmic-text" }

[profile.release]
# `3`, not `z`. This profile used to optimise for size, which is the wrong trade
# for this binary: everything the window does per frame -- laying out the tree,
# resolving text, rasterising -- is CPU work, and `z` gives up inlining and
# vectorisation on exactly that work. On a machine drawing through the software
# rasteriser (see `crates/palantir-desktop/src/gpu.rs`) the frame cost is the
# whole of how responsive the window feels, so the frames are bought back at the
# price of a larger executable.
opt-level = 3
lto = true
codegen-units = 1
strip = true
# Deliberately *not* `abort`. A launcher that aborts on a panic dies the instant
# one is raised, with no message and nothing on disk: a reader whose window
# closed on a click sees a crash and no explanation, and neither they nor we can
# say which click it was. `unwind` lets `main`'s hook catch it, write the panic
# and the backtrace next to the launcher's log, and tell the reader what happened.
# The cost is a little binary size, which is not worth being unable to debug.
panic = "unwind"
